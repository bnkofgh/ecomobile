<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --blue: #0A3D91;
  --blue2: #1256c4;
  --green: #168a3a;
  --green2: #20a84b;
  --white: #ffffff;
  --light: #f5f8fc;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--light);
  margin: 0;
  padding: 20px;
  text-align: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  margin-bottom: 25px;
}

.header-title {
  background: linear-gradient(135deg, var(--blue), var(--blue2));
  color: var(--white);
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: bold;
  display: inline-block;
  font-size: 16px;
}

.subtext {
  color: #555;
  font-size: 14px;
  margin-top: 10px;
}

.container {
  background: var(--white);
  border-radius: 16px;
  max-width: 360px;
  width: 100%;
  margin: 30px auto;
  padding: 35px 25px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

.success-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green), var(--green2));
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: bold;
}

h2 {
  color: var(--blue);
  margin: 0 0 12px;
}

.message {
  color: #555;
  font-size: 15px;
  line-height: 1.6;
}

.button {
  display: block;
  width: 100%;
  padding: 14px 0;
  margin-top: 25px;
  background: linear-gradient(135deg, var(--green), var(--green2));
  color: var(--white);
  text-decoration: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.button:hover {
  background: linear-gradient(135deg, #116d2e, var(--green));
}

footer {
  margin-top: auto;
  padding: 15px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-title">DEMO MOBILE SERVICES</div>
  <div class="subtext">Demo verification process</div>
</div>

<div class="container">

  <div class="success-icon">
    ✓
  </div>

  <h2>Thank You</h2>

  <div class="message">
    Your demo verification has been completed successfully.
  </div>

  <a href="index.html" class="button">
    Start Again →
  </a>

</div>

<footer>
  Demo Mobile Services
</footer>

</body>
</html>
