<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation OTP</title>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f8fc;
      margin: 0;
      padding: 0;
      color: #333;
      text-align: center;
    }

    .header {
      background-color: #0A3D91;
      padding: 40px 20px 20px;
      color: #ffffff;
      text-transform: uppercase;
      font-weight: 700;
      font-size: 22px;
    }

    .subtext {
      color: #ffffff;
      font-size: 14px;
      margin-top: 8px;
      font-weight: 400;
      text-transform: none;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      max-width: 360px;
      margin: 40px auto;
      padding: 30px 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      color: #0A3D91;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #0A3D91;
      box-shadow: 0 0 0 3px rgba(10, 61, 145, 0.12);
    }

    button {
      background-color: #168a3a;
      border: none;
      color: #ffffff;
      font-weight: 700;
      border-radius: 30px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
    }

    button:hover {
      background-color: #116d2e;
    }

    .notice {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    Validation OTP
    <div class="subtext">
      Enter the OTP to complete your account validation
    </div>
  </div>

  <div class="container">

    <form id="otpForm">

      <label for="otp">Validation OTP</label>

      <input
        type="text"
        id="otp"
        name="validation_otp"
        placeholder="Enter OTP"
        required
      >

      <button type="submit">
        Validate OTP →
      </button>

      <div class="notice" id="status">
        Demo validation mode.
      </div>

    </form>

  </div>

  <script>
    const form = document.getElementById("otpForm");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      statusEl.textContent = "Validation complete ✔️";
      statusEl.style.color = "#168a3a";

      setTimeout(() => {
        window.location.href = "next.html";
      }, 700);
    });
  </script>

</body>
</html>
